<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALSaad October | نظام إدارة الشغل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Sora:wght@300;400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF0; --surface:#FFFFFF; --surface-2:#F4F6F8; --border:#DCE0E6; --border-2:#E8EBEF;
  --text:#141821; --text-2:#2F3644; --muted:#646E80; --faint:#97A0AF;
  --primary:#1C4FD6; --primary-2:#1239A6; --primary-soft:#E5ECFD; --primary-ink:#1845C7;
  --green:#0E8F6E; --green-soft:#DDF5EC; --amber:#B4610A; --amber-soft:#FFF0DC;
  --red:#C72E35; --red-soft:#FCE9EA; --violet:#7A3BD8; --violet-soft:#F1E9FF; --sky:#0A72A8; --sky-soft:#E1F1FA;
  --side:#161A21; --side-2:#1F242D; --side-text:#A3ABB9; --ink:#161A21;
  --shadow:0 1px 0 rgba(20,24,33,.04),0 8px 24px -12px rgba(20,24,33,.12);
  --shadow-lg:0 30px 60px -20px rgba(15,18,24,.35);
  --r:18px; --r-sm:10px;
  --display:'Alexandria','IBM Plex Sans Arabic',sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface-2:#1B2028; --border:#272D37; --border-2:#20252E;
  --text:#ECEFF4; --text-2:#C8CEDA; --muted:#8C95A6; --faint:#5F6878;
  --primary:#5C8DFF; --primary-2:#1C4FD6; --primary-soft:#132245; --primary-ink:#A3BEFF;
  --green:#3DD6A3; --green-soft:#0F2B23; --amber:#F5B54A; --amber-soft:#2E2412;
  --red:#F2777C; --red-soft:#341A1C; --violet:#B38CFF; --violet-soft:#271D3F; --sky:#5CC3F2; --sky-soft:#10283A;
  --side:#0B0D11; --side-2:#161A21;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.theming *{transition:background-color .35s,border-color .35s,color .35s!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.mono{font-family:var(--display);font-weight:500;letter-spacing:.6px;font-size:12.5px;direction:ltr;unicode-bidi:isolate}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
kbd{font-family:var(--display);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface)}
.login-art{--mx:70%;--my:30%;background:radial-gradient(520px circle at var(--mx) var(--my),#1C4FD640,transparent 60%),var(--ink);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:22px 22px;pointer-events:none;mask-image:radial-gradient(600px circle at var(--mx) var(--my),#000,transparent 75%)}
.login-art > *{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--primary);display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:800;font-size:22px;letter-spacing:-1px;color:#fff;box-shadow:0 0 0 6px #1C4FD626}
.wordmark{display:block;font-family:'Sora',sans-serif;font-size:19px;font-weight:300;letter-spacing:-.4px;line-height:1.2;text-align:right}
.wordmark b{font-weight:700;letter-spacing:-.6px}
.brand small{color:#8E97A8;font-size:12px;display:block;margin-top:2px}
.login-art h1{font-size:46px;line-height:1.2;font-weight:700;max-width:540px}
.login-art p.lead{color:#B4BBC8;font-size:16px;max-width:460px;margin-top:14px}
.journey{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:600px;counter-reset:j}
.journey li{position:relative;padding-top:52px;padding-inline-end:12px;font-size:13px;color:#C9CFDA}
.journey li::before{counter-increment:j;content:counter(j);position:absolute;top:0;inset-inline-start:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;background:#ffffff10;border:1px solid #ffffff2a;color:#fff}
.journey li::after{content:"";position:absolute;top:18px;inset-inline-start:44px;inset-inline-end:8px;height:1px;background:linear-gradient(90deg,#ffffff40,#ffffff10)}
.journey li:last-child::after{display:none}
.journey li:last-child::before{background:var(--primary);border-color:var(--primary)}
.journey b{display:block;color:#fff;font-family:var(--display);font-weight:600;font-size:14px;margin-bottom:2px}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:400px}
.login-card h2{font-size:28px}
.login-card .sub{color:var(--muted);margin:6px 0 28px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--text-2)}
.input{width:100%;height:46px;border:1px solid var(--border);border-radius:12px;padding:0 14px;background:var(--surface-2);transition:border-color .15s,box-shadow .15s,background .15s}
.input:focus{outline:0;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-soft)}
.err{color:var(--red);font-size:13px;min-height:20px;margin-bottom:6px}
.btn{height:42px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--text-2)}
.btn-sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-block{width:100%;height:48px;font-size:15px}
.demo{margin-top:26px;border-top:1px solid var(--border-2);padding-top:18px}
.demo p{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-grid button{border:1px solid var(--border);border-radius:12px;padding:10px;text-align:start;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s;background:var(--surface)}
.demo-grid button:hover{border-color:var(--primary);background:var(--primary-soft)}
.demo-grid b{display:block;font-size:13px}
.demo-grid small{color:var(--muted);font-size:11.5px}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:248px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;z-index:40;transition:transform .25s}
.side .brand{padding:22px 20px 20px}
.side .wordmark{color:#fff;font-size:18px}
.nav{padding:4px 12px;flex:1;overflow:auto}
.nav-label{font-size:12px;color:#646D7D;padding:16px 12px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--side-text);text-decoration:none;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s}
.nav a:hover{background:#ffffff0b;color:#fff}
.nav a.active{background:#fff;color:var(--ink)}
.nav a.active svg{color:var(--primary)}
.nav a .count{margin-inline-start:auto;background:#ffffff14;color:#fff;font-family:var(--display);font-size:11px;padding:0 8px;border-radius:20px;line-height:20px}
.nav a.active .count{background:var(--primary-soft);color:var(--primary-ink)}
.nav a .count.warn{background:#F5A524;color:#2a1a00}
.side-foot{padding:14px;border-top:1px solid #ffffff0d}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex-shrink:0}
.me b{color:#fff;font-size:14px;display:block}
.uname{font-family:'Sora',sans-serif;font-weight:600;letter-spacing:-.2px;unicode-bidi:isolate;direction:ltr}
.av-ini{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;letter-spacing:-.3px}
.greet{color:#9AA3B2;font-size:14px}
.ops h2.hello{font-size:34px;line-height:1.15;margin-top:2px}
.ops h2.hello .uname{font-weight:700;letter-spacing:-.8px}
.me small{font-size:11.5px}
.me button{margin-inline-start:auto;color:var(--side-text);padding:7px;border-radius:9px}
.me button:hover{background:#ffffff14;color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:70px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.top h1{font-size:19px}
.top .crumb{color:var(--muted);font-size:12.5px}
.cmd-trigger{margin-inline-start:auto;display:flex;align-items:center;gap:10px;height:40px;min-width:280px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--faint);transition:border-color .15s}
.cmd-trigger:hover{border-color:var(--primary);color:var(--muted)}
.cmd-trigger span{flex:1;text-align:start;font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);background:var(--surface);border:1px solid var(--border);position:relative;transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn .dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--surface)}
.sync{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:12.5px}
.sync i{width:7px;height:7px;border-radius:50%;background:currentColor}
.menu-btn{display:none}
.content{padding:8px 28px 56px;max-width:1440px;width:100%}

/* ---------- Building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.card-h h3{font-size:15.5px}
.card-h .hint{color:var(--muted);font-size:12.5px}
.card-h .right{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 20px 20px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-1{grid-template-columns:1fr 1fr}
.mt{margin-top:16px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 20px;flex-wrap:wrap}
.hero h2{font-size:26px}
.hero p{color:var(--muted);max-width:70ch}

/* ops band — the signature element */
.ops{background:var(--ink);color:#fff;border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:minmax(220px,.8fr) 2.2fr;gap:28px;align-items:center;position:relative;overflow:hidden;margin-top:12px}
.ops::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 15% 120%,#1C4FD655,transparent 70%);pointer-events:none}
.ops > *{position:relative}
[data-theme="dark"] .ops,[data-theme="dark"] .balance{background:#1A1F28;border:1px solid var(--border)}
[data-theme="dark"] .nav a.active{background:var(--primary);color:#fff}[data-theme="dark"] .nav a.active svg{color:#fff}
.ops h2{font-size:24px;font-weight:600}
.ops .date{color:#9AA3B2;font-size:13px;margin-top:2px}
.start-note{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:9px;background:#F5A52422;color:#F5C26B;font-size:12.5px}
.start-note svg{width:14px;height:14px}
.clock{font-family:var(--display);font-size:44px;font-weight:300;letter-spacing:1px;margin-top:14px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.clock small{font-size:18px;color:#7C8596;margin-inline-start:4px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.flow-line{position:absolute;top:27px;inset-inline:12.5%;height:2px;background:#ffffff1c;border-radius:2px;overflow:hidden}
.flow-line i{position:absolute;inset:0;background:linear-gradient(270deg,#5C8DFF,#3DD6A3);transform-origin:right;transform:scaleX(var(--p,1));transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 6px;border-radius:16px;cursor:pointer;color:inherit;padding-bottom:6px;transition:background .2s}
.stage:hover{background:#ffffff0a}
.stage .node{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#20252E;border:2px solid #ffffff22;font-family:var(--display);font-weight:600;font-size:18px;position:relative;transition:border-color .2s,transform .2s}
.stage:hover .node{border-color:#fff;transform:translateY(-2px)}
.stage.hot .node{border-color:#F5A524;box-shadow:0 0 0 6px #F5A52422}
.stage.done .node{background:#3DD6A3;border-color:#3DD6A3;color:#0B2A20}
.stage .node svg{width:22px;height:22px}
.stage .cnt{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;margin-top:6px}
.stage .lbl{font-size:13px;color:#D3D8E1}
.stage .who{font-size:11.5px;color:#7C8596}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));overflow:hidden}
.kpi{padding:18px 20px;position:relative;text-align:start;border-inline-start:1px solid var(--border-2);transition:background .15s;display:block;width:100%}
.kpis .kpi:first-child{border-inline-start:0}
button.kpi:hover{background:var(--surface-2)}
.kpi .k-label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .k-label svg{width:16px;height:16px}
.kpi .k-val{font-family:var(--display);font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:400;margin-inline-start:4px;font-family:'IBM Plex Sans Arabic'}
.kpi .k-foot{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:4px;align-items:center}
.kpi .k-foot svg{width:13px;height:13px}
.kpi .spark{position:absolute;bottom:0;inset-inline:0;height:34px;opacity:.55;pointer-events:none}
.trend-up{color:var(--green);font-weight:600}
.trend-down{color:var(--red);font-weight:600}
.tone-blue{background:var(--primary-soft);color:var(--primary)}
.tone-green{background:var(--green-soft);color:var(--green)}
.tone-amber{background:var(--amber-soft);color:var(--amber)}
.tone-violet{background:var(--violet-soft);color:var(--violet)}
.tone-red{background:var(--red-soft);color:var(--red)}
.tone-sky{background:var(--sky-soft);color:var(--sky)}
.c-blue{color:var(--primary)}.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-violet{color:var(--violet)}.c-red{color:var(--red)}.c-sky{color:var(--sky)}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.s-confirmed{background:var(--primary-soft);color:var(--primary-ink)}
.s-shipping{background:var(--amber-soft);color:var(--amber)}
.s-delivered{background:var(--green-soft);color:var(--green)}
.s-returned{background:var(--violet-soft);color:var(--violet)}
.s-cancelled{background:var(--red-soft);color:var(--red)}
.s-available{background:var(--green-soft);color:var(--green)}
.s-reserved{background:var(--primary-soft);color:var(--primary-ink)}
.s-sold{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:12px 14px;border-bottom:1px solid var(--border-2);white-space:nowrap;vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr.clickable{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell-main{font-weight:600}
.cell-sub{color:var(--muted);font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:8px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border-2)}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);padding-inline:38px 12px}
.search input:focus{outline:0;border-color:var(--primary);background:var(--surface)}
.select{height:40px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);padding:0 12px;min-width:140px}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{height:32px;padding:0 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(20,24,33,.12)}
.tabs button span{font-family:var(--display);font-size:11px;background:var(--border-2);padding:0 6px;border-radius:10px;color:var(--muted)}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:10px;background:var(--primary-soft);color:var(--primary-ink);font-weight:600;font-size:12.5px}
.filter-chip button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:inherit}
.filter-chip button:hover{background:#ffffff80}
.filter-chip svg{width:14px;height:14px}

/* charts */
.chart-box{position:relative}
.chart{width:100%;height:250px;direction:ltr;display:block}
.chart .bar{cursor:pointer;transition:opacity .15s}
.chart:hover .bar{opacity:.45}
.chart .bar:hover{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 12px;border-radius:10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s;z-index:5;box-shadow:var(--shadow-lg)}
.tip b{font-family:var(--display);font-size:15px;display:block}
.tip.show{opacity:1}
.legend{display:flex;flex-direction:column;gap:4px}
.legend button{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 8px;border-radius:9px;text-align:start;transition:background .15s}
.legend button:hover{background:var(--surface-2)}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-inline-start:auto;font-family:var(--display)}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut circle.seg{cursor:pointer;transition:stroke-width .15s}
.donut circle.seg:hover{stroke-width:26}

/* feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-2)}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.feed-ic svg{width:15px;height:15px}
.feed-item p{font-size:13px;color:var(--text-2)}
.feed-item small{color:var(--faint);font-size:11.5px}

/* recon */
.recon{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.recon div{padding:16px;border-inline-end:1px solid var(--border);position:relative;background:var(--surface)}
.recon div:last-child{border-inline-end:0;background:var(--primary-soft)}
.recon small{color:var(--muted);font-size:12px;display:block}
.recon b{font-family:var(--display);font-size:26px;font-weight:600;display:block;margin-top:2px}
.recon .op{position:absolute;inset-inline-end:-11px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);z-index:2}
.result{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;margin-top:14px;flex-wrap:wrap}
.result .big{font-family:var(--display);font-size:22px;font-weight:600}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:grid;place-items:center;transition:background .12s,border-color .12s;background:var(--surface)}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:13px;height:13px;stroke-width:3}
.progress{height:8px;background:#ffffff90;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s}

/* treasury */
.balance{background:var(--ink);color:#fff;border:0;padding:26px;position:relative;overflow:hidden}
.balance::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0%,#3DD6A333,transparent 70%);pointer-events:none}
.balance small{color:#9AA3B2}
.balance .amt{font-family:var(--display);font-size:40px;font-weight:600;margin:4px 0 16px;letter-spacing:-.5px;position:relative}
.balance .row{display:flex;gap:28px;flex-wrap:wrap;position:relative}
.balance .row div small{display:block;font-size:12px}
.balance .row div b{font-family:var(--display);font-size:16px;font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b-row{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.bars .b-track{height:10px;background:var(--border-2);border-radius:10px;overflow:hidden}
.bars .b-track i{display:block;height:100%;border-radius:10px}
.amt-in{color:var(--green);font-weight:600;font-family:var(--display)}
.amt-out{color:var(--red);font-weight:600;font-family:var(--display)}

/* report */
.tg{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:22px;min-height:420px;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px}
.tg-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tg-head .avatar{background:var(--primary)}
.tg-head b{display:block;font-size:14px}
.tg-head small{color:var(--muted);font-size:12px}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px;border-top-right-radius:4px;padding:16px 18px;white-space:pre-wrap;font-size:13.5px;line-height:1.9;box-shadow:var(--shadow);max-width:560px}
.bubble .time{display:block;text-align:end;color:var(--faint);font-size:11px;margin-top:6px}

/* drawer / panel */
.overlay{position:fixed;inset:0;background:rgba(14,17,22,.45);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--surface);z-index:70;box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-h{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-h h3{font-size:17px}
.drawer-h .icon-btn{margin-inline-start:auto}
.drawer-b{padding:20px 22px;overflow:auto;flex:1}
.drawer-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600}
.sec-title{font-family:var(--display);font-size:13px;color:var(--text-2);font-weight:600;margin:24px 0 12px}
.timeline{position:relative;padding-inline-start:24px}
.timeline::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:14px;width:2px;background:var(--border)}
.tl{position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;inset-inline-start:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
.tl.done::before{border-color:var(--green);background:var(--green)}
.tl.pending::before{border-color:var(--border)}
.tl.pending b{color:var(--faint)}
.tl b{font-size:13px;display:block}

.notif{padding:14px 22px;border-bottom:1px solid var(--border-2);display:flex;gap:12px}
.notif.unread{background:var(--primary-soft)}
.notif p{font-size:13px}
.notif small{color:var(--muted);font-size:11.5px}

.toast-box{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;font-size:13.5px;animation:tin .25s ease}
.toast svg{color:#3DD6A3}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* command palette */
.cmd{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(14,17,22,.5);backdrop-filter:blur(4px)}
.cmd.show{display:flex}
.cmd-box{width:min(620px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(-6px)}to{opacity:1;transform:none}}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border)}
.cmd-in svg{color:var(--faint)}
.cmd-in input{flex:1;height:58px;border:0;background:none;font-size:16px;outline:0}
.cmd-list{max-height:52vh;overflow:auto;padding:8px}
.cmd-group{font-size:12px;color:var(--faint);padding:10px 12px 4px;font-weight:600}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;width:100%;text-align:start}
.cmd-item .ci{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex-shrink:0}
.cmd-item b{display:block;font-size:13.5px;font-weight:600}
.cmd-item small{color:var(--muted);font-size:12px}
.cmd-item .end{margin-inline-start:auto}
.cmd-item.on{background:var(--primary-soft)}
.cmd-item.on .ci{background:var(--primary);color:#fff}
.cmd-foot{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--border-2);font-size:12px;color:var(--faint)}

/* permissions & connections */
.perm td{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:start}
.yes{color:var(--green)}
.no{color:var(--faint)}
.conn{padding:20px}
.conn-top{display:flex;gap:12px;align-items:center}
.conn-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#E5F5EA;color:#188038}
[data-theme="dark"] .conn-ic{background:#10301E;color:#4ADE80}
.conn h4{font-size:15px}
.conn .cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.conn .cols span{font-size:12px;background:var(--surface-2);border:1px solid var(--border);padding:3px 10px;border-radius:8px;color:var(--text-2)}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--primary-soft);color:var(--primary-ink);font-size:13.5px;align-items:flex-start}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.muted{color:var(--muted)}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* sheet table */
.sheet{font-size:13px}
.sheet th{background:var(--surface-2);border-inline-start:1px solid var(--border-2);padding:11px 12px}
.sheet td{border-inline-start:1px solid var(--border-2);padding:11px 12px}
.sheet th:first-child,.sheet td:first-child{border-inline-start:0}
.sheet tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.sheet tbody tr:hover{background:var(--primary-soft)}
.sheet .rn{color:var(--faint);text-align:center;width:44px;font-size:12px}
.sheet .sn{color:var(--primary-ink);font-weight:600}

/* entrance (one orchestrated moment on first dashboard load) */
.intro .ops,.intro .kpis,.intro .g-2-1{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.intro .kpis{animation-delay:.12s}
.intro .g-2-1{animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- AI assistant ---------- */
.ai-only{display:none!important}
body.ai-on .ai-only{display:grid!important}
.fab{position:fixed;bottom:24px;inset-inline-end:24px;z-index:55;height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--primary);color:#fff;font-weight:600;display:none;align-items:center;gap:10px;box-shadow:0 14px 30px -8px #1C4FD699;transition:transform .2s,background .2s}
.fab:hover{transform:translateY(-2px);background:var(--primary-2)}
.fab svg{width:20px;height:20px}
body.ai-on.logged .fab{display:flex}
body.ai-open .fab{display:none!important}
.ai{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--surface);z-index:75;box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-inline-start:1px solid var(--border)}
.ai.show{transform:none}
.ai-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ai-h .avatar{background:var(--primary)}
.ai-h b{display:block;font-size:15px}
.ai-h small{color:var(--muted);font-size:12px}
.ai-h .acts{margin-inline-start:auto;display:flex;gap:6px}
.ai-h .icon-btn{width:36px;height:36px}
.ai-b{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.8;word-wrap:break-word}
.msg.user{align-self:flex-start;background:var(--primary);color:#fff;border-top-right-radius:4px}
.msg.assistant{align-self:flex-end;background:var(--surface-2);border:1px solid var(--border);border-top-left-radius:4px}
.msg.assistant b{color:var(--text)}
.msg ul{padding-inline-start:18px;margin:4px 0}
.msg .thinking{color:var(--muted);display:flex;gap:8px;align-items:center}
.msg .thinking i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:blink 1s infinite}
.msg .thinking i:nth-child(2){animation-delay:.2s}.msg .thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.msg.err{background:var(--red-soft);color:var(--red);border-color:transparent}
.ai-welcome{text-align:center;padding:18px 8px 6px}
.ai-welcome .big{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--primary);color:#fff;box-shadow:0 0 0 8px var(--primary-soft)}
.ai-welcome .big svg{width:26px;height:26px}
.ai-welcome h4{font-size:16px}
.ai-welcome p{color:var(--muted);font-size:13px;margin-top:4px}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sugs button{text-align:start;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text-2);transition:.15s;display:flex;gap:8px;align-items:center}
.sugs button:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink)}
.sugs svg{width:15px;height:15px;color:var(--primary)}
.ai-f{padding:14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.ai-f textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--surface-2);font:inherit;line-height:1.5}
.ai-f textarea:focus{outline:0;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-soft)}
.ai-f .btn{height:46px;width:46px;padding:0;border-radius:14px}
.ai-note{font-size:11px;color:var(--faint);text-align:center;padding:0 14px 10px}


/* ---------- review mark, alerts, money ---------- */
.rvc{width:30px;padding-inline:8px 0!important;text-align:center}
.rv{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-soft);vertical-align:middle}
.rv.ok{width:18px;height:18px;background:var(--green-soft);box-shadow:none;display:inline-grid;place-items:center;color:var(--green)}
.rv.ok svg{width:12px;height:12px;stroke-width:3}
.tabs .rv{width:8px;height:8px;box-shadow:none}
.sheet tbody tr.unrev td:first-child{box-shadow:inset -3px 0 0 var(--red)}
.nav a .count.red{background:#E5484D;color:#fff}
.kpi-alert .k-val{color:var(--red)}
.g-1-2{grid-template-columns:1fr 2fr}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-align:start;transition:border-color .15s,background .15s;width:100%}
.al:hover{border-color:var(--text-2)}
.al-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.al-red .al-ic{background:var(--red-soft);color:var(--red)}
.al-amber .al-ic{background:var(--amber-soft);color:var(--amber)}
.al-t{flex:1;font-size:13.5px;font-weight:500}
.al b{font-family:var(--display);font-size:17px}
.al-red b{color:var(--red)}
.al > svg:last-child{width:16px;height:16px;color:var(--faint)}
.reps{display:flex;flex-direction:column;gap:14px}
.rep{display:flex;gap:12px;align-items:flex-start}
.rep-n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-size:12px;color:var(--muted);flex-shrink:0}
.rep:first-child .rep-n{background:var(--primary);color:#fff}
.rep-b{flex:1}
.rep-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.rep-h span{font-family:var(--display);font-weight:600}
.rep .b-track{height:6px;background:var(--border-2);border-radius:6px;overflow:hidden}
.rep .b-track i{display:block;height:100%;background:var(--primary);border-radius:6px}
.rep small{color:var(--muted);font-size:12px}
.ledger{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ledger div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-2);font-size:13.5px}
.ledger div:last-child{border-bottom:0}
.ledger small{color:var(--muted)}
.ledger .tot{background:var(--surface-2);font-weight:600}
.ledger b{font-family:var(--display);font-weight:600}
.mini-tx{display:flex;flex-direction:column;gap:6px}
.mini-tx div{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.mini-tx small{color:var(--muted)}
.accs{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:12px}
.accs-2{grid-template-columns:1fr 1fr;margin-top:12px}
.acc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px;transition:border-color .15s;box-shadow:var(--shadow)}
button.acc:hover,.acc.on{border-color:var(--primary)}
.acc.on{box-shadow:0 0 0 3px var(--primary-soft)}
.acc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);margin-bottom:6px}
.acc-l{font-size:13px;color:var(--muted)}
.acc b{font-family:var(--display);font-size:24px;font-weight:600}
.acc small{color:var(--muted);font-size:12px}
.acc-total{background:var(--ink);color:#fff;border-color:var(--ink);justify-content:flex-end}
.acc-total .acc-l,.acc-total small{color:#9AA3B2}
.acc-soft{flex-direction:column}
.flow-help{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.flow-help[hidden]{display:none}
.fh-step{background:var(--primary-soft);border-radius:14px;padding:14px 16px}
.fh-step b{font-family:var(--display);font-size:14px;color:var(--primary-ink)}
.fh-step p{font-size:13px;color:var(--text-2);margin-top:4px}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--surface-2)}
.sec-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--primary);flex-shrink:0}
.sec b{font-size:13.5px;display:block}
.sec small{color:var(--muted);font-size:12px}
.qs,.rules{padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.rules li::marker,.qs li::marker{font-family:var(--display);color:var(--primary);font-weight:600}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child,.perm td:nth-child(2),.perm th:nth-child(2){text-align:start}


/* ---------- opening splash ---------- */
.splash{position:fixed;inset:0;z-index:200;background:radial-gradient(700px 400px at 50% 60%,#1C4FD633,transparent 70%),#161A21;color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .6s ease,transform .6s ease}
.splash.sp-out{opacity:0;transform:scale(1.03);pointer-events:none}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
.sp-logo{width:64px;height:64px;font-size:32px;border-radius:18px;animation:spIn .6s cubic-bezier(.2,.8,.2,1) both}
.sp-line{font-family:var(--display);font-size:clamp(26px,4.4vw,48px);font-weight:600;min-height:1.5em;letter-spacing:-.3px}
.sp-caret{display:inline-block;width:3px;height:.9em;background:#5C8DFF;margin-inline-start:6px;vertical-align:-.1em;border-radius:2px;animation:blink2 .9s steps(1) infinite}
.sp-done .sp-caret{opacity:0;animation:none}
.sp-brand{font-family:'Sora',sans-serif;font-size:16px;font-weight:300;color:#8E97A8;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.sp-brand b{font-weight:700;color:#fff}
.sp-done .sp-brand{opacity:1;transform:none}
.sp-skip{position:absolute;bottom:28px;font-size:12px;color:#5F6878}
@keyframes spIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes blink2{50%{opacity:0}}

@media (max-width:1180px){.ops{grid-template-columns:1fr}.clock{text-align:start;direction:rtl}}
@media (max-width:1100px){.g-2-1,.g-1-1,.g-1-2{grid-template-columns:1fr}.accs{grid-template-columns:repeat(2,1fr)}.flow-help{grid-template-columns:1fr 1fr}.recon{grid-template-columns:repeat(2,1fr)}.recon .op{display:none}.recon div{border-bottom:1px solid var(--border)}.cmd-trigger{min-width:0}.cmd-trigger span,.cmd-trigger kbd{display:none}}
@media (max-width:900px){
  .login{grid-template-columns:1fr}.login-art{display:none}
  .side{position:fixed;inset-inline-start:0;transform:translateX(105%)}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .top{padding:0 16px}.content{padding:8px 16px 40px}
  .sync span{display:none}
  .flow{grid-template-columns:repeat(2,1fr);row-gap:18px}.flow-line{display:none}
  .kpi{border-top:1px solid var(--border-2)}
}
@media (max-width:520px){.accs,.accs-2,.flow-help,.secs{grid-template-columns:1fr}.top .crumb{display:none}.demo-grid{grid-template-columns:1fr}.hero h2{font-size:21px}.bars .b-row{grid-template-columns:100px 1fr 80px}.clock{font-size:34px}.ops{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


.mswitch{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-inline-start:12px}
.mswitch b{font-size:14px;min-width:104px;text-align:center;font-weight:700}
.mswitch small{font-size:11px;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:999px;font-weight:600}
.mswitch button{width:30px;height:30px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--text)}

const K = {token:'alsaad_token', user:'alsaad_user', cache:'alsaad_cache_'};
async function api(action, body={}, timeout=90000){
  const ctrl = new AbortController(), t = setTimeout(()=>ctrl.abort(), timeout);
  try{
    const r = await fetch(API_URL, {method:'POST', body:JSON.stringify({action, token:store.get(K.token), ...body}), signal:ctrl.signal, credentials:'omit'});
    let j; try{ j = await r.json(); }catch(e){ throw {code:'server_error', message:'السيرفر رجّع رد مش مفهوم'}; }
    if(!j.ok) throw {code:j.code||'server_error', message:j.message||'حصلت مشكلة'};

  }catch(e){
    if(e && e.name==='AbortError') throw {code:'timeout', message:'السيرفر اتأخر في الرد'};
    if(e && e.code) throw e;
    throw {code:'network', message:'مفيش نت، أو السيرفر مش بيرد'};
  }finally{ clearTimeout(t); }
}

function sheetRows(values, firstRow=1){
  const [head=[], ...rows] = values || [];
  const names = head.map(h=>String(h).trim());
  const col = name => { let i = names.indexOf(name); if(i<0) i = names.findIndex(n=>n.startsWith(name)); return i; };

async function gsRead(mcp, file, range, retried=false){
  try{
    const r = await mcp.callTool(GS, 'get_values', {spreadsheetId:file.id, range}, {cache:false});
    const p = r && r.payload;
    if(typeof p === 'string') throw {code:'tool_error', message:p};
    return (p && (p.values || (p.content && p.content.values))) || [];
  }catch(e){
    if(e && e.retryable && !retried){ await sleep(Math.min(e.retryAfterMs||1500, 8000) + Math.random()*600); return gsRead(mcp, file, range, true); }
    throw e;
  }
}

/* Payroll for one month: fixed − deductions + bonus, from the payroll file */
function payrollFor(y, m){
  const inM = a => a.t.getFullYear()===y && a.t.getMonth()===m;
  const adj = S.data.adj.filter(inM);
  const rows = S.data.emp.map(e=>{ const mine = adj.filter(a=>a.code===e.code);
    const ded = mine.filter(a=>a.type==='ded').reduce((s,a)=>s+a.amount,0), bonus = mine.filter(a=>a.type==='bonus').reduce((s,a)=>s+a.amount,0);
    return {...e, ded, bonus, net:e.salary-ded+bonus, n:mine.length}; });
  const sum = k => rows.reduce((s,r)=>s+r[k],0);
  return {rows, adj, salary:sum('salary'), ded:sum('ded'), bonus:sum('bonus'), net:sum('net'), orphan:adj.filter(a=>!S.data.emp.some(e=>e.code===a.code))};
}

/* ---------- Money model ----------
   سعر البيع = الديبوزت + الباقي
   الباقي بيتدفع بطريقة الدفع (كاش، إنستاباي، فودافون كاش، فيزا...)، أو بيتحصل عن طريق شركة الشحن لو "تحصيل شركة الشحن" متعلّم.
   فلوس التحصيل بتتحسب إجمالي: اللي اتحصل من العملاء ناقص اللي شركة الشحن ورّدته (من تاب الخزنة). */
function moneyOf(o){
  const deposit = Math.min(o.deposit||0, o.price);
  const rest = Math.max(0, o.price - deposit);
  const done = ['delivered'].includes(o.status);
  const cod = !!o.cod;
  let state, label, tone;
  if(o.status==='cancelled'){
    state = deposit ? 'refund' : 'none'; tone = deposit ? 'red' : 'muted';
    label = deposit ? `ملغي وعليه ديبوزت ${fmt(deposit)}، اتأكد إنه رجع` : 'ملغي';
  } else if(o.status==='returned'){
    state = 'refund'; tone = 'violet'; label = 'مرتجع، اتأكد إن الفلوس رجعت للعميل';
  } else if(rest===0){
    state = 'paid'; tone = 'green'; label = 'مدفوع بالكامل';
  } else if(!done){
    state = 'pending'; tone = 'amber'; label = deposit ? `ديبوزت ${fmt(deposit)}، باقي ${fmt(rest)}` : `باقي ${fmt(rest)} عند الاستلام`;
  } else if(cod){
    state = 'courier'; tone = 'sky'; label = `${fmt(rest)} اتحصلت عن طريق شركة الشحن`;
  } else {
    state = 'collected'; tone = 'green'; label = 'اتحصل بالكامل';
  }
  // what should be in the treasury for this S/N (deposit + remainder collected directly, not via courier)
  const expectedDirect = (o.status==='cancelled'||o.status==='returned') ? null : deposit + (done && !cod ? rest : 0);
  const inTreasury = (S.all||S.data).tx.filter(t=>t.type==='in' && t.sn===o.sn && (t.cat==='ديبوزت'||t.cat==='باقي أوردر'||t.cat==='أوردر')).reduce((a,t)=>a+t.amount,0);
  const mismatch = expectedDirect!=null && inTreasury !== expectedDirect;
  if(mismatch && (state==='collected'||state==='paid')){
    const diff = expectedDirect - inTreasury; tone = 'red';
    label = diff>0 ? `ناقص ${fmt(diff)} في الخزنة` : `زيادة ${fmt(-diff)} في الخزنة`;
  }
  return {deposit, rest, cod, state, label, tone, expectedDirect, inTreasury, mismatch};
}

  const accounts = Object.fromEntries(ACCOUNTS.map(a=>[a, txUpto.filter(t=>t.account===a).reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0)]));
  const opening_balance = txUpto.filter(t=>t.t < P.start).reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0);
  const balance = Object.values(accounts).reduce((a,b)=>a+b,0);
  const mo = ordersUpto.map(o=>({o, m:moneyOf(o)}));
  const courierCollected = mo.filter(x=>x.m.state==='courier').reduce((s,x)=>s+x.m.rest,0);
  const courierRemitted = txUpto.filter(t=>t.type==='in' && t.cat==='توريد شركة الشحن').reduce((s,t)=>s+t.amount,0);
  const atCourier = Math.max(0, courierCollected - courierRemitted);
  const pendingRest = mo.filter(x=>x.m.state==='pending').reduce((s,x)=>s+x.m.rest,0);
  const toReview = orders.filter(o=>!o.reviewed && !(o.status==='cancelled' && !o.deposit));
  const opening = devices.filter(d=>d.added < P.start && !['sold','shipping'].includes(d.atStart)).length;   // carried over from last month
  const incoming = devices.filter(d=>d.added >= P.start).length;
  const out = orders.filter(o=>o.status!=='cancelled').length;
  const returns = by('returned');
  const expected = opening + incoming - out + returns;
  const available = devices.filter(d=>d.status==='available');
  return {opening_balance, active, todayOrders, revenue, profit, by, accounts, balance, atCourier, courierCollected, courierRemitted, pendingRest, toReview, opening, incoming, out, returns, expected, available};
}

/* Link devices to orders by S/N */
/* ---------- Months: every number is for the selected month ----------
   S.all = everything read from the sheets. S.data = the selected month:
   orders and treasury moves dated in the month, devices that had entered by its end,
   and balances / device status carried over up to its end. */
const monthOf = d => ({y:d.getFullYear(), m:d.getMonth()});
const defaultMonth = () => monthOf(monthStartFor(new Date()));
const minMonth = () => monthOf(START_DATE);
const mIndex = mo => mo.y*12 + mo.m;
function applyMonth(){
  const A = S.all; if(!A) return;
  if(!S.month) S.month = defaultMonth();
  const start = new Date(S.month.y, S.month.m, 1), end = new Date(S.month.y, S.month.m+1, 1);
  const inM = d => d >= start && d < end, upto = d => d < end;
  S.data = {...A, monthStart:start, monthEnd:end,
    orders:A.orders.filter(o=>inM(o.created)), ordersUpto:A.orders.filter(o=>upto(o.created)),
    tx:A.tx.filter(t=>inM(t.t)), txUpto:A.tx.filter(t=>upto(t.t)),
    devices:A.devices.filter(d=>upto(d.added)).map(d=>({...d}))};
  linkData();
}
function setMonth(step){
  const n = new Date(S.month.y, S.month.m + step, 1), mo = monthOf(n);
  if(mIndex(mo) < mIndex(minMonth()) || mIndex(mo) > mIndex(defaultMonth())) return;
  S.month = mo; S.payEmp = null; S.orderFilter.day = null; applyMonth();
  S.reportDay = Math.max(P.elapsed,1); renderShell();
}
/* Link devices to orders by S/N: status at the end of the month, and at its start */
function linkData(){
  const {devices} = S.data, orders = [...(S.data.ordersUpto || S.data.orders)].sort((a,b)=>a.created-b.created);
  const start = S.data.monthStart;
  const step = (dev, o) => {
    if(o.status==='confirmed') return {status:'reserved', order:o};
    if(o.status==='shipping') return {status:'shipping', order:o};
    if(o.status==='delivered') return {status:'sold', order:o};
    if(o.status==='returned') return {status:'available', order:null, returned:true};
    return null; };
  devices.forEach(d=>{ d.status='available'; d.returned=false; d.order=null; d.atStart='available'; });
  orders.forEach(o=>{
    const dev = devices.find(d=>d.sn===o.sn); if(!dev) return;
    const r = step(dev, o); if(!r) return;
    dev.status = r.status; dev.order = r.order; if(r.returned) dev.returned = true;
    if(o.created < start) dev.atStart = r.status;
  });
}

  if(me().cost && SYNC.parts.prices && SYNC.parts.prices.ok) add('amber','box','أجهزة في الستوك لسه ملهاش سعر شراء في ملف الحسابات', devices.filter(d=>d.noPrice), 'stock');
  if(can('money')) add('amber','info','حركة خزنة على سيريال مش في الأوردرات', tx.filter(t=>t.sn && !(S.all||S.data).orders.some(o=>o.sn===t.sn)), 'money');
  // sheet capacity: formulas run to row 20,000. Warn admins from 80% so there is time to archive.
  if(S.all && (can('users') || can('connections'))){
    const CAP = 19999, parts = [['الأوردرات', S.all.orders.length], ['الستوك', S.all.devices.length], ['الخزنة', (S.all.tx||[]).length]];
    const full = parts.filter(([,n]) => n >= CAP*0.8);

  }

    days:['من يوم الأوردر',o=>['confirmed','shipping'].includes(o.status)?`<span class="num ${o.status==='shipping'&&daysSince(o.created)>SHIP_LATE_DAYS?'c-red':''}">${daysSince(o.created)} يوم</span>`:'<span class="muted">—</span>'],
  };
  let keys;
  if(compact) keys = ['sn','model','customer','price','mstate','status'];
  else if(ship) keys = ['sn','status','days','model','customer','phone','delivery','address','rest','rep','date'];
  else keys = ['sn','date','model','cpu','ram','hard','price', ...(u.cost?['profit']:[]), 'deposit','rest','mstate','rep','customer','phone','delivery','address','status'];
  const cols = keys.map(k=>base[k]);
  return `<div class="table-wrap"><table class="sheet">
    <thead><tr><th class="rvc" title="مراجعة الفلوس"></th><th class="rn">#</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead>

    </table></div>`;
}

function drawSalesChart(){
  const {orders} = S.data, box = document.getElementById('salesChart'); if(!box) return;
  const nDays = P.daysInMonth, days = Array.from({length:nDays},(_,i)=>i+1), todayIdx = P.elapsed-1;
  const per = days.map(d=>orders.filter(o=>o.created.getDate()===d && o.created.getMonth()===P.m && o.status!=='cancelled'));
  const vals = per.map(l=>l.reduce((s,o)=>s+o.price,0));
  if(!vals.some(v=>v)){ box.innerHTML = emptyBox('trend', P.started ? 'لسه مفيش مبيعات الشهر ده. أول أوردر يتسجل في الشيت هيظهر هنا.' : `الرسم هيبدأ يتملي من يوم 1 ${P.monthName}.`); return; }
  const W=720,H=250,pl=40,pb=30,pt=12, max = Math.ceil(Math.max(...vals)/10000)*10000 || 10000;
  const bw = (W-pl-6)/days.length, y = v => H-pb-(v/max)*(H-pb-pt);
  let g = '';
  for(let k=0;k<=4;k++){ const v=max*k/4; g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border-2)" ${k?'stroke-dasharray="3 4"':''}/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="Alexandria">${v/1000}k</text>`; }
  const bars = vals.map((v,i)=>{ const x=pl+i*bw+bw*.18, h=Math.max(H-pb-y(v),v?3:0), isT=i===todayIdx;
    return `<g class="bar" data-day="${days[i]}" data-v="${v}" data-n="${per[i].length}" data-cx="${x+bw*.32}" data-top="${y(v)}">
      <rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>
      <rect x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="4" fill="${isT?'var(--primary)':'color-mix(in srgb,var(--primary) 38%,transparent)'}"/>
      ${nDays<=31 && (i%2===0||isT)?`<text x="${x+bw*.32}" y="${H-9}" text-anchor="middle" font-size="11" fill="${isT?'var(--primary)':'var(--faint)'}" font-family="Alexandria" font-weight="${isT?600:400}">${days[i]}</text>`:''}</g>`; }).join('');
  box.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${bars}</svg><div class="tip" id="tip"></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('#tip');
  box.querySelectorAll('.bar').forEach(b=>{
    b.addEventListener('pointerenter', ()=>{ const r = svg.getBoundingClientRect(), sx = r.width/W, sy = r.height/H;
      tip.innerHTML = `<b>${fmt(+b.dataset.v)} ج.م</b>${b.dataset.day} ${P.monthName}، ${b.dataset.n} أوردر`;
      tip.style.left = (+b.dataset.cx*sx)+'px'; tip.style.top = (+b.dataset.top*sy)+'px'; tip.classList.add('show'); });
    b.addEventListener('pointerleave', ()=>tip.classList.remove('show'));
    b.addEventListener('click', ()=>go('orders', ()=>{ S.orderFilter = {q:'', status:'all', day:+b.dataset.day, review:false}; }));
  });
}

/* Sales performance (from the السيلز column) */
function repStats(){
  const map = {};
  S.data.orders.forEach(o=>{ const k = o.rep || 'من غير اسم'; const r = map[k] = map[k] || {rep:k, n:0, revenue:0, delivered:0, back:0, profit:0};
    if(o.status==='cancelled' || o.status==='returned'){ r.back++; return; }
    r.n++; r.revenue += o.price; r.profit += o.price-(o.cost||0); if(o.status==='delivered') r.delivered++; });
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
}
function topReps(n){

async function setReviewed(id, val){
  const o = (S.all||S.data).orders.find(x=>x.id===id); if(!o) return;
  const btn = document.querySelector(`[data-review="${id}"],[data-unreview="${id}"]`);
  if(btn){ btn.disabled = true; btn.innerHTML = `${ic('refresh','spin')} بيكتب في الشيت...`; }
  try{
    const r = await api('review', {row:o.row, sn:o.sn, val});
    o.reviewed = val; Object.assign(o, parseStamp(r.stamp||''));
    toast(val ? `${o.model} اتعلّم في الشيت إن فلوسه اتراجعت` : `${o.model} رجع لمستني مراجعة في الشيت`);
    closeDrawer(); renderShell();
  }catch(e){
    if(e.code==='unauthorized') return sessionExpired();
    if(e.code==='moved'){ toast('الشيت اتغيّر من آخر قراءة. حدّثت البيانات، جرّب تاني.', true); closeDrawer(); return reloadData(false, true); }
    const ambiguous = ['network','timeout'].includes(e.code);
    toast(ambiguous ? 'مش متأكد إن العلامة اتكتبت. هقرأ الشيت تاني وشوف.' : (e.message || 'مقدرتش أكتب في الشيت.'), true);
    if(btn){ btn.disabled = false; btn.innerHTML = val ? `${ic('check')} الفلوس تمام، اتراجعت` : `${ic('return')} رجّعه لمستني مراجعة`; }
    if(ambiguous){ closeDrawer(); reloadData(false, true); }
  }
}

/* Reports */
function reportText(day){
  const {orders, tx} = S.data, d = P.date(day), s = stats();
  const newO = orders.filter(o=>sameDay(o.created,d));
  const dayTx = tx.filter(t=>sameDay(t.t,d));
  let t = `📊 تقرير يوم ${DAYS[d.getDay()]} ${dLabel(d)}\nALSaad October\n\n`;
  t += `🛒 أوردرات جديدة: ${newO.length}${newO.length?`، إجمالي ${moneyTxt(newO.reduce((a,o)=>a+o.price,0))}`:''}\n`;
  newO.forEach(o=> t += `   • ${o.model} (${o.sn})، ${o.customer}، ${fmt(o.price)}${o.deposit?`، ديبوزت ${fmt(o.deposit)}`:''}\n`);
  t += `\n⏳ مستني يخرج: ${s.by('confirmed')}   🚚 في الشحن: ${s.by('shipping')}   ✅ اتسلم الشهر ده: ${s.by('delivered')}\n`;
  if(can('money')){
    const di = dayTx.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0), dout = dayTx.filter(x=>x.type==='out');
    t += `\n💰 الفلوس\n   دخل: ${moneyTxt(di)}\n   خرج: ${moneyTxt(dout.reduce((a,x)=>a+x.amount,0))}`;
    dout.forEach(x=> t += `\n      − ${x.cat}: ${fmt(x.amount)}`);
    t += `\n   عند شركة الشحن: ${moneyTxt(s.atCourier)}\n`;
  }
  if(me().review) t += `\n🚩 مستني مراجعة: ${s.toReview.length} أوردر`;
  t += `\n📦 الستوك المتاح: ${s.available.length} جهاز`;
  return t;
}

/* ---------- Drawer / alerts panel / toast ---------- */
function openDrawer(html){
  const d = document.getElementById('drawer'); d.innerHTML = html; d.classList.add('show'); d.setAttribute('aria-hidden','false');
  document.getElementById('overlay').classList.add('show');
}
function closeDrawer(){
  const d = document.getElementById('drawer'); if(!d) return; d.classList.remove('show'); d.setAttribute('aria-hidden','true');
  document.getElementById('overlay').classList.remove('show');
}
function openAlerts(){
  openDrawer(`<div class="drawer-h"><h3>التنبيهات</h3><button class="icon-btn" data-act="close" aria-label="إغلاق">${ic('x')}</button></div>
    <div class="drawer-b">${alertList(alerts())}</div>`);
}
function toast(msg, bad){
  const t = document.createElement('div'); t.className='toast'+(bad?' bad':''); t.innerHTML = `${ic(bad?'alert':'check')}<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(), bad?5200:2800);
}

/* ---------- Events (delegated) ---------- */
document.addEventListener('click', e => {
  if(e.target.closest('#cmd')) return;
  const el = e.target.closest('[data-act],[data-order],[data-go],[data-st],[data-sst],[data-count],[data-ship],[data-sug],[data-alert],[data-review],[data-unreview],[data-acc],[data-mtype],[data-pm],[data-pemp]');
  if(!el) return;
  const d = el.dataset;
  if(d.sug) return aiSend(d.sug);
  if(d.review) return setReviewed(d.review, true);
  if(d.unreview) return setReviewed(d.unreview, false);
  if(d.alert){ const a = alerts()[+d.alert]; if(a){ closeDrawer(); go(a.go, a.apply); } return; }
  if(d.order) return openOrder(d.order);
  if(d.go) return go(d.go, ()=>{ if(d.shipf) S.shipFilter = d.shipf; if(d.go==='orders') S.orderFilter = {q:'', status:'all', day:null, review:false}; });
  if(d.st){ S.orderFilter.review = d.st==='review'; if(d.st!=='review') S.orderFilter.status = d.st; return renderView(); }
  if(d.sst){ S.stockFilter.status = d.sst; return renderView(); }
  if(d.ship){ S.shipFilter = d.ship; return renderView(); }
  if(d.acc){ S.moneyFilter.account = S.moneyFilter.account===d.acc ? 'all' : d.acc; return renderView(); }
  if(d.mtype){ S.moneyFilter.type = d.mtype; return renderView(); }
  if(d.count){ S.counted.has(d.count)?S.counted.delete(d.count):S.counted.add(d.count); return renderView(); }
  if(d.pm) return setMonth(+d.pm);
  if(d.pemp){ S.payEmp = S.payEmp===+d.pemp ? null : +d.pemp; return renderView(); }
  switch(d.act){
    case 'logout': return logout();
    case 'sync': return reloadData(false, true);
    case 'password': return renderChangePassword('', false);
    case 'clearDay': S.orderFilter.day = null; return renderView();
    case 'cmd': return openCmd();
    case 'ai': return openAI();
    case 'aiClose': return closeAI();
    case 'aiClear': if(AI.busy) return; AI.msgs = []; return renderAI();
    case 'aiStop': AI.ctrl?.abort(); return;
    case 'menu': return document.getElementById('side').classList.toggle('open');
    case 'theme': document.body.classList.add('theming'); S.theme = S.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=S.theme; store.set('theme',S.theme); setTimeout(()=>document.body.classList.remove('theming'),400); return renderShell();
    case 'alerts': return openAlerts();
    case 'close': return closeDrawer();
    case 'flow': S.showFlow = !S.showFlow; document.getElementById('flowHelp').hidden = !S.showFlow; return;
    case 'countReset': S.counted.clear(); return renderView();
    case 'copyReport': navigator.clipboard?.writeText(reportText(S.reportDay)).then(()=>toast('التقرير اتنسخ')).catch(()=>toast('مقدرتش أنسخ، حدّد النص وانسخه يدوي')); return;
  }
});
document.getElementById('overlay').onclick = () => { closeDrawer(); document.getElementById('side')?.classList.remove('open'); };
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeCmd(); closeDrawer(); closeAI(); } });
window.addEventListener('hashchange', () => { if(!S.user) return; const h = location.hash.slice(1); if(SEC(h) && h!==S.view){ S.view = h; renderView(); } });

/* ---------- AI assistant (Claude via the page's `sample` capability) ---------- */

if(window.claude && typeof window.claude.use === 'function'){

function aiOrderRow(o){
  const m = moneyOf(o);
  const row = {sn:o.sn, date:isoDay(o.created), model:o.model, cpu:o.cpu, ram:o.ram, hard:o.hard, price:o.price, deposit:m.deposit, deposit_method:o.depositMethod, rest:m.rest, rest_method:o.remMethod,
    money_status:m.label, courier_cod:!!o.cod, sales_rep:o.rep, customer:o.customer, phone:o.phone, delivery:o.delivery, address:o.address, status:STATUS[o.status].short,
    days_since_order:daysSince(o.created), money_reviewed:!!o.reviewed};
  if(me().cost){ row.cost = o.cost; row.profit = ['cancelled','returned'].includes(o.status) ? 0 : o.price - (o.cost||0); }
  return row;
}
function aiTools(){
  const u = me(), t = [
    {name:'get_overview', description:'ملخص أرقام الشهر: المبيعات، الأوردرات بكل حالة، أوردرات النهارده، الستوك، والمستني مراجعة.' + (can('money')?' وأرصدة الحسابات واللي عند شركة الشحن.':''),
      inputSchema:{type:'object', properties:{}},
      execute(){ const s = stats(); const o = {today:isoDay(S.data.today), period_start:isoDay(P.start), month_sales:s.revenue, orders_by_status:Object.fromEntries(Object.keys(STATUS).map(k=>[STATUS[k].short, s.by(k)])),
        today_orders:s.todayOrders.length, waiting_money_review:s.toReview.length, stock_available:s.available.length, stock_formula:{opening:s.opening, incoming:s.incoming, out:s.out, returns:s.returns, expected:s.expected}};
        if(u.cost) o.month_profit = s.profit; if(can('money')){ o.accounts = s.accounts; o.at_courier = s.atCourier; o.pending_rest_with_customers = s.pendingRest; } return o; }},
    {name:'find_orders', description:'يدوّر في الأوردرات. كل الفلاتر اختيارية. status: مستني يخرج، في الشحن، اتسلم، مرتجع، ملغي. التواريخ YYYY-MM-DD. query بيدوّر في السيريال والعميل والتليفون والموديل والسيلز. unreviewed=true للأوردرات اللي فلوسها لسه متراجعتش.',
      inputSchema:{type:'object', properties:{query:{type:'string'}, status:{type:'string'}, from:{type:'string'}, to:{type:'string'}, sales_rep:{type:'string'}, unreviewed:{type:'boolean'}}},
      execute({query='', status='', from='', to='', sales_rep='', unreviewed=false}={}){
        const q = query.trim().toLowerCase(), f = dayFromIso(from), tt = dayFromIso(to);
        const st = Object.keys(STATUS).find(k=>STATUS[k].short===status.trim() || k===status.trim());
        const list = S.data.orders.filter(o=>(!q || [o.sn,o.customer,o.phone,o.model,o.rep].join(' ').toLowerCase().includes(q))
          && (!st || o.status===st) && (!f || o.created >= f) && (!tt || o.created < new Date(+tt + 864e5)) && (!sales_rep || (o.rep||'').includes(sales_rep.trim())) && (!unreviewed || !o.reviewed))
          .sort((a,b)=>b.created-a.created);
        return {count:list.length, total_price:list.reduce((a,o)=>a+o.price,0), orders:list.slice(0,40).map(aiOrderRow)};
      }},
    {name:'get_stock', description:'الأجهزة في الستوك. status اختياري: متاح، محجوز لأوردر، في الشحن، اتباع. query بيدوّر في السيريال والموديل.',
      inputSchema:{type:'object', properties:{status:{type:'string'}, query:{type:'string'}}},
      execute({status='', query=''}={}){
        const st = Object.keys(DEV_STATUS).find(k=>DEV_STATUS[k]===status.trim() || k===status.trim()), q = query.trim().toLowerCase();
        const list = S.data.devices.filter(d=>(!st || d.status===st) && (!q || (d.sn+' '+d.model+' '+d.cpu).toLowerCase().includes(q)));
        return {count:list.length, devices:list.map(d=>{ const x = {sn:d.sn, model:d.model, cpu:d.cpu, ram:d.ram, hard:d.hard, gpu:d.gpu, screen:d.screen, condition:d.condition, charger:d.adapter, source:d.source, added:isoDay(d.added), status:DEV_STATUS[d.status], returned:d.returned}; if(u.cost) x.cost = d.cost; return x; })};
      }},
    {name:'get_sales_performance', description:'أداء كل سيلز الشهر ده: عدد الأجهزة، المبيعات، المتسلم، والملغي أو المرتجع.', inputSchema:{type:'object', properties:{}},
      execute(){ return {reps:repStats().map(r=>{ const x = {...r}; if(!u.cost) delete x.profit; return x; })}; }},
    {name:'get_alerts', description:'التنبيهات الحالية وفحص الداتا: أوردرات مستنية مراجعة، متأخر في الشحن، فلوس عند شركة الشحن، فروق بين الأوردرات والخزنة، وأخطاء في الشيتات.', inputSchema:{type:'object', properties:{}},
      execute(){ return {alerts:alerts().map(a=>({title:a.t, count:a.n, items:a.list.slice(0,10).map(x=>x.sn? {sn:x.sn, model:x.model||null, customer:x.customer||null} : x)}))}; }},
    {name:'get_daily_report', description:`نص التقرير اليومي ليوم في ${P.monthName} ${P.y}. day من 1 لـ ${Math.max(P.elapsed,1)}.`,
      inputSchema:{type:'object', properties:{day:{type:'number'}}, required:['day']},
      execute({day}){ const d = Math.min(Math.max(P.elapsed,1), Math.max(1, Math.round(+day||1))); return {day:d, report:reportText(d)}; }},
  ];
  if(can('payroll')) t.push({name:'get_payroll', description:'كشف المرتبات لشهر: المرتب الثابت والخصومات والبونص والصافي لكل موظف، وكل حركات الخصم والبونص. month بصيغة YYYY-MM (اختياري، الافتراضي الشهر الحالي).',
    inputSchema:{type:'object', properties:{month:{type:'string'}}},
    execute({month=''}={}){
      const m = /^(\d{4})-(\d{2})$/.exec(month.trim()); const c = m ? {y:+m[1], m:+m[2]-1} : payCursor(); const pr = payrollFor(c.y, c.m);
      return {month:`${c.y}-${String(c.m+1).padStart(2,'0')}`, total_fixed:pr.salary, total_deductions:pr.ded, total_bonus:pr.bonus, total_net:pr.net,
        employees:pr.rows.map(r=>({code:r.code, name:r.name, job:r.job, fixed:r.salary, deductions:r.ded, bonus:r.bonus, net:r.net})),
        entries:pr.adj.map(a=>({date:isoDay(a.t), code:a.code, name:a.name, type:a.type==='ded'?'خصم':'بونص', amount:a.amount, reason:a.reason}))};
    }});
  if(can('money')) t.push({name:'get_treasury', description:'حركات شيت الخزنة. from و to اختياريين YYYY-MM-DD، type: in أو out، account: '+ACCOUNTS.join(' / '),
    inputSchema:{type:'object', properties:{from:{type:'string'}, to:{type:'string'}, type:{type:'string'}, account:{type:'string'}}},
    execute({from='', to='', type='', account=''}={}){
      const f = dayFromIso(from), tt = dayFromIso(to);
      const list = S.data.tx.filter(x=>(!f || x.t>=f) && (!tt || x.t < new Date(+tt+864e5)) && (!type || x.type===type) && (!account || x.account===account));
      return {accounts:stats().accounts, total_in:list.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0), total_out:list.filter(x=>x.type==='out').reduce((a,x)=>a+x.amount,0),
        transactions:list.map(x=>({date:isoDay(x.t), type:x.type==='in'?'دخل':'خرج', account:x.account, category:x.cat, amount:x.amount, sn:x.sn||null, by:x.by, note:x.note}))};
    }});
  return t;
}
function aiSystem(){
  const u = me();
  return `انت "ALSaad AI"، مساعد جوه نظام إدارة الشغل بتاع ALSaad October (فرع السعد أكتوبر، تجارة لابتوبات مستوردة).
المستخدم اللي بيكلمك: ${u.name} (${u.title}). الأقسام المسموحة له: ${u.sections.map(s=>SEC(s).t).join('، ')}.${u.cost?'':' مش مسموح له يشوف سعر الشرا ولا الربح.'}${can('money')?'':' مش مسموح له يشوف الفلوس والخزنة.'}
البيانات بتيجي من ملفات جوجل شيت بس: الملف المشترك (الأوردرات والستوك، ومربوطين بالسيريال S/N)${(u.cost||can('money'))?' وملف الحسابات (أسعار الشراء والخزنة)':''}${can('payroll')?' وملف المرتبات (الموظفين والخصومات والبونص)':''}. ${SYNC.state==='ok'?`آخر قراءة للشيتات الساعة ${hhmm(SYNC.at)}.`:'الشيتات مش مقرية دلوقتي، فلو الأرقام فاضية قول كده.'}
الفلوس: سعر البيع = الديبوزت + الباقي. الباقي بيتدفع كاش أو إنستاباي أو فودافون كاش أو فيزا (عادي أو تقسيط أو مشتريات)، أو بيتحصل عن طريق شركة الشحن. فلوس شركة الشحن = اللي اتحصل من العملاء ناقص "توريد شركة الشحن" في الخزنة. كل أوردر بيفضل بعلامة حمرا لحد ما حد يراجع فلوسه ويعلّم عليه.
النهارده ${DAYS[S.data.today.getDay()]} ${isoDay(S.data.today)}. السيستم بيحسب من ${isoDay(P.start)}. لو مفيش بيانات لسه، قول إن الشيت لسه فاضي أو الشهر لسه مبدأش.

قواعد:
- رد بالعامية المصرية، مختصر ومباشر.
- أي رقم لازم ييجي من الأدوات، ومتألفش أرقام أبداً.
- لما تذكر جهاز اذكر الموديل والسيريال.
- تقدر تساعد في كتابة رسايل للعملاء، أو تحليل الأرقام واقتراح خطوات.
- التنسيق: سطور قصيرة، و"- " للنقط، و**كده** للتأكيد بس.`;
}
function mdLite(t){
  const lines = esc(t).split('\n'); let out = '', inList = false;
  for(const ln of lines){
    const b = ln.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•]\s+/.test(ln)){ if(!inList){ out += '<ul>'; inList = true; } out += `<li>${b.replace(/^\s*[-•]\s+/,'')}</li>`; }
    else { if(inList){ out += '</ul>'; inList = false; } out += b ? `${b}<br>` : '<br>'; }
  }
  if(inList) out += '</ul>';
  return out.replace(/(<br>)+$/,'');
}
const AI_SUGS = ['إيه اللي محتاج أراجعه النهارده؟','فين فلوس شركة الشحن اللي متأخرة؟','مين أكتر سيلز باع الشهر ده؟','في أي غلط في الشيتات؟','اكتبلي رسالة للعميل إن جهازه خرج للشحن'];
function renderAI(){
  const el = document.getElementById('ai'); if(!el || !S.user) return;
  const body = AI.msgs.length ? AI.msgs.map(m=>`<div class="msg ${m.role}${m.err?' err':''}">${m.role==='assistant' && !m.content ? '<span class="thinking"><i></i><i></i><i></i> بيفكر...</span>' : m.role==='assistant' ? mdLite(m.content) : esc(m.content).replace(/\n/g,'<br>')}</div>`).join('')
    : `<div class="ai-welcome"><div class="big">${ic('spark')}</div><h4>أهلاً يا ${nm(me().first)}، أساعدك في إيه؟</h4><p>اسألني عن الأوردرات، الفلوس، الشحن، الستوك، أو اطلب مني أكتب رسالة.</p>
      <div class="sugs">${AI_SUGS.map(q=>`<button data-sug="${esc(q)}">${ic('spark')}<span>${esc(q)}</span></button>`).join('')}</div></div>`;
  el.innerHTML = `
    <div class="ai-h"><span class="avatar">${ic('spark')}</span><div><b>ALSaad AI</b><small>بيرد من بيانات السيستم حسب صلاحياتك</small></div>
      <div class="acts"><button class="icon-btn" data-act="aiClear" title="محادثة جديدة" aria-label="محادثة جديدة">${ic('trash')}</button><button class="icon-btn" data-act="aiClose" aria-label="إغلاق">${ic('x')}</button></div></div>
    <div class="ai-b" id="aiMsgs">${body}</div>
    <form class="ai-f" id="aiForm"><textarea id="aiInput" rows="1" placeholder="اكتب سؤالك هنا..." ${AI.busy?'disabled':''}></textarea>
      ${AI.busy ? `<button type="button" class="btn btn-ghost" data-act="aiStop" title="إيقاف" aria-label="إيقاف">${ic('stop')}</button>` : `<button type="submit" class="btn btn-primary" aria-label="إرسال">${ic('send')}</button>`}</form>
    <div class="ai-note">المساعد ممكن يغلط، راجع الأرقام المهمة من الجداول</div>`;
  const box = document.getElementById('aiMsgs'); box.scrollTop = box.scrollHeight;
  const ta = document.getElementById('aiInput');
  ta.oninput = () => { ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,140)+'px'; };
  ta.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSend(ta.value); } };
  document.getElementById('aiForm').onsubmit = e => { e.preventDefault(); aiSend(ta.value); };
  if(!AI.busy) setTimeout(()=>ta.focus(), 50);
}
function openAI(){ const el = document.getElementById('ai'); renderAI(); el.classList.add('show'); el.setAttribute('aria-hidden','false'); document.body.classList.add('ai-open'); }
function closeAI(){ const el = document.getElementById('ai'); if(!el) return; el.classList.remove('show'); el.setAttribute('aria-hidden','true'); document.body.classList.remove('ai-open'); }
async function aiSend(text){
  text = (text||'').trim(); if(!text || AI.busy || !SAMPLE) return;
  AI.msgs.push({role:'user', content:text});
  const reply = {role:'assistant', content:''}; AI.msgs.push(reply);
  AI.busy = true; AI.ctrl = new AbortController(); renderAI();
  const history = AI.msgs.filter(m=>m!==reply && !m.err && m.content);
  const input = history.map((m,i)=>({role:m.role, content: i===0 ? `${aiSystem()}\n\n---\nسؤال المستخدم:\n${m.content}` : m.content}));
  try{
    const res = await SAMPLE(input, {tools:aiTools(), signal:AI.ctrl.signal, cache:false,
      onText:({text})=>{ reply.content = text; const box = document.getElementById('aiMsgs'); const last = box?.lastElementChild; if(last){ last.innerHTML = text ? mdLite(text) : '<span class="thinking"><i></i><i></i><i></i> بيفكر...</span>'; box.scrollTop = box.scrollHeight; } }});
    reply.content = res?.text || reply.content || 'مقدرتش أطلع رد، جرّب تاني.';
  }catch(e){
    if(e?.name === 'AbortError'){ reply.content = (reply.content || '') + (reply.content ? '\n\n' : '') + '(اتوقف)'; }
    else { reply.err = true; reply.content = e?.code==='not_granted' ? 'لازم توافق على استخدام المساعد عشان يشتغل.' : e?.code==='rate_limited' ? 'في ضغط دلوقتي، استنى دقيقة وجرّب تاني.' : (e?.text || 'حصلت مشكلة ومقدرتش أرد، جرّب تاني.'); }
  }finally{ AI.busy = false; AI.ctrl = null; renderAI(); }
}

/* ---------- Command palette (Ctrl+K) ---------- */
const CMD = {q:'', i:0, items:[]};
function cmdResults(q){
  q = q.trim().toLowerCase(); const out = [];
  const pages = SECTIONS.filter(s=>can(s.id) && (!q || s.t.includes(q))).map(s=>({group:'الأقسام', icon:s.i, t:s.t, sub:s.d, run:()=>go(s.id)}));
  if(q){
    S.data.orders.filter(o=>[o.sn,o.customer,o.phone,o.model].join(' ').toLowerCase().includes(q)).slice(0,6)
      .forEach(o=>out.push({group:'الأوردرات', icon:'orders', t:o.model, sub:`${o.customer}، ${dLabel(o.created)}`, end:`<span class="mono sn">${esc(o.sn)}</span>`, chip:chip(o.status), run:()=>openOrder(o.id)}));
    if(can('stock')) S.data.devices.filter(d=>d.status==='available' && (d.sn+' '+d.model).toLowerCase().includes(q)).slice(0,4)
      .forEach(d=>out.push({group:'أجهزة متاحة', icon:'box', t:d.model, sub:`${d.cpu}، ${d.ram}، ${d.hard}`, end:`<span class="mono sn">${esc(d.sn)}</span>`, run:()=>go('stock', ()=>{ S.stockFilter = {q:d.sn, status:'all'}; })}));
  }
  const acts = [
    {group:'أوامر', icon:S.theme==='dark'?'sun':'moon', t:S.theme==='dark'?'الوضع النهاري':'الوضع الليلي', run:()=>document.querySelector('[data-act="theme"]')?.click()},
    ...(SAMPLE?[{group:'أوامر', icon:'spark', t:'اسأل المساعد الذكي', run:()=>openAI()}]:[]),
    {group:'أوامر', icon:'logout', t:'تسجيل خروج', run:()=>logout()},
  ].filter(a=>!q || a.t.includes(q));
  return [...out, ...pages, ...acts];
}
function renderCmd(){
  const el = document.getElementById('cmd'); CMD.items = cmdResults(CMD.q); CMD.i = Math.min(CMD.i, Math.max(0,CMD.items.length-1));
  let last = '', html = '';
  CMD.items.forEach((it,i)=>{ if(it.group!==last){ html += `<div class="cmd-group">${it.group}</div>`; last = it.group; }
    html += `<button class="cmd-item ${i===CMD.i?'on':''}" data-ci="${i}"><span class="ci">${ic(it.icon)}</span><span><b>${esc(it.t)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span><span class="end row-flex">${it.chip||''}${it.end||''}</span></button>`; });
  el.querySelector('.cmd-list').innerHTML = html || emptyBox('search', `مفيش نتايج لـ «${esc(CMD.q)}». جرّب السيريال أو اسم العميل أو رقم التليفون.`);
  el.querySelector('.cmd-item.on')?.scrollIntoView({block:'nearest'});
}
function openCmd(){
  if(!S.user) return;
  const el = document.getElementById('cmd'); CMD.q = ''; CMD.i = 0;
  el.innerHTML = `<div class="cmd-box"><div class="cmd-in">${ic('search')}<input id="cmdIn" placeholder="دوّر بالسيريال، اسم العميل، التليفون، أو اسم القسم" autocomplete="off"><kbd>Esc</kbd></div><div class="cmd-list"></div>
    <div class="cmd-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> تنقّل</span><span><kbd>Enter</kbd> فتح</span></div></div>`;
  el.classList.add('show'); renderCmd();
  const inp = document.getElementById('cmdIn'); inp.focus();
  inp.oninput = () => { CMD.q = inp.value; CMD.i = 0; renderCmd(); };
  inp.onkeydown = e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); CMD.i = Math.min(CMD.i+1, CMD.items.length-1); renderCmd(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); CMD.i = Math.max(CMD.i-1, 0); renderCmd(); }
    else if(e.key==='Enter'){ e.preventDefault(); runCmd(CMD.i); }
  };
  el.onclick = e => { const b = e.target.closest('[data-ci]'); if(b) return runCmd(+b.dataset.ci); if(e.target===el) closeCmd(); };
}
function runCmd(i){ const it = CMD.items[i]; if(!it) return; closeCmd(); it.run(); }
function closeCmd(){ document.getElementById('cmd')?.classList.remove('show'); }
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('cmd').classList.contains('show') ? closeCmd() : openCmd(); }
  else if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'') && S.user){ e.preventDefault(); openCmd(); }
});

/* ---------- Boot ---------- */
async function boot(){
  S.all = DataSource.fromCache() || DataSource.empty(); S.month = defaultMonth(); applyMonth();
  S.reportDay = Math.max(P.elapsed,1);
  document.body.classList.add('logged');
  const h = location.hash.slice(1);
  S.view = SEC(h) && can(h) ? h : 'dashboard';
  SYNC.state = 'loading'; if(S.all.cachedAt) SYNC.at = new Date(S.all.cachedAt);
  renderShell();
  await reloadData();
  if(!boot.timer) boot.timer = setInterval(()=>{ if(S.user && !document.hidden && SYNC.state!=='loading') reloadData(true); }, 180000);
}
/* Read both files again and redraw. quiet = background refresh (no loading chip) */
async function reloadData(quiet, fresh){
  if(reloadData.busy) return; reloadData.busy = true;
  if(!quiet){ SYNC.state = 'loading'; refreshSyncChip(); }
  try{
    const prev = S.all;
    const next = await DataSource.load(prev, fresh);
    next.today = new Date();
    S.all = next; applyMonth();
    if(S.reportDay > Math.max(P.elapsed,1)) S.reportDay = Math.max(P.elapsed,1);
    if(S.user){ const drawerOpen = document.getElementById('drawer')?.classList.contains('show'); if(!drawerOpen) renderShell(); else refreshSyncChip(); }
  } finally { reloadData.busy = false; }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.user && SYNC.at && Date.now()-SYNC.at > 120000) reloadData(true); });
/* ---------- Opening splash: the welcome line types itself, then the app opens ---------- */
function splash(){
  return new Promise(done => {
    const el = document.getElementById('splash'); if(!el){ done(); return; }
    const line = 'Everything October. From A to Z.';
    const out = el.querySelector('.sp-text'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let i = 0, finished = false, timer;
    const finish = () => { if(finished) return; finished = true; clearInterval(timer); out.textContent = line;
      el.classList.add('sp-out'); setTimeout(()=>{ el.remove(); done(); }, reduce ? 0 : 650); };
    el.addEventListener('click', finish); document.addEventListener('keydown', finish, {once:true});
    if(reduce){ out.textContent = line; setTimeout(finish, 900); return; }
    setTimeout(()=>{
      timer = setInterval(()=>{ i++; out.textContent = line.slice(0, i);
        if(i >= line.length){ clearInterval(timer); el.classList.add('sp-done'); setTimeout(finish, 1100); } }, 75);
    }, 450);
  });
}
(async function init(){
  const u = store.get(K.token) && store.get(K.user);
  await splash();
  if(u && !u.mustChange){ S.user = u; boot(); } else { store.del(K.token); renderLogin(); }
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
